name: Build Aura Calculator Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-flutter-apk:
    name: Build Release APK (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Broken Android Lint Vital Check
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/disable-lint.gradle
          allprojects {
              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains("lint")) {
                      task.enabled = false
                  }
              }
          }
          EOF

      - name: Generate Android Platform Wrapper & Configure App Name + Icons
        run: |
          flutter create --platforms=android --org com.aura --project-name aura_calculator .
          sed -i 's/android:label="[^"]*"/android:label="আউরা ক্যালকুলেটর"/g' android/app/src/main/AndroidManifest.xml
          cp -r assets/launcher/mipmap-* android/app/src/main/res/

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Aura Calculator Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Calculator-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
